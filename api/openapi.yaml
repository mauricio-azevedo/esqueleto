openapi: 3.1.0
info:
  title: <name>
  version: 0.0.0
  description: <One sentence. Same as the README's.>
paths:
  /healthz:
    get:
      summary: Process is up
      operationId: healthz
      responses:
        "200":
          description: Up
  /readyz:
    get:
      summary: Dependencies are reachable
      operationId: readyz
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready; the body says which dependency
